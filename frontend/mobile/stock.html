<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'">
<title>库存查询 - 备件管理系统（手机端）</title>
<link rel="icon" href="../assets/images/logo.png">
<link rel="stylesheet" href="../assets/css/font-awesome.min.css">
<link rel="stylesheet" href="mobile.css">
</head>
<body class="m-body" data-page="stock">
<div class="m-app">
  <header class="m-header">
    <div class="m-title"><i class="fa fa-cubes"></i> 库存查询</div>
    <div class="m-ctx" id="mCtx"></div>
  </header>

  <main class="m-main">
    <div class="m-card">
      <div class="m-row" style="gap:8px;">
        <input class="m-input m-grow" id="mStockKw" placeholder="搜索条码 / 名称 / 库位">
        <button type="button" class="m-btn m-btn-primary m-btn-sm" data-act="stockScan"><i class="fa fa-camera"></i> 扫码</button>
        <button type="button" class="m-btn m-btn-ghost m-btn-sm" data-act="stockRefresh"><i class="fa fa-refresh"></i></button>
      </div>
      <div class="m-mt8 m-muted" id="mStockCount">加载中…</div>
    </div>
    <div class="m-card" id="mStockList">
      <div class="m-empty">加载中…</div>
    </div>
  </main>

  <nav class="m-tabbar" id="mTabbar"></nav>
</div>
<script src="pages/stock.js"></script>
<script src="mobile.js"></script>
</body>
</html>
