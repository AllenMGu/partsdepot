<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-9RxWUfPpirA4mlTLEspAFhQpqMNUh/2lofoGyr6r4Fc='; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
    <title>申请提交 - 备件管理系统</title>
    <link href="assets/css/tailwind.css" rel="stylesheet">
    <link href="assets/css/font-awesome.min.css" rel="stylesheet">
    <link href="assets/css/polish.css" rel="stylesheet">
</head>
<body class="bg-gray-100 min-h-screen flex flex-col polish">
    <header class="bg-white shadow-sm z-10">
        <div class="flex items-center justify-between px-4 py-3">
            <div class="flex items-center">
                <img src="assets/images/logo.png" alt="Logo" class="h-8 w-8">
                <span class="ml-2 text-lg font-semibold text-gray-800">备件管理系统</span>
            </div>
            <a href="index.html" class="text-sm text-gray-600 hover:text-primary">
                <i class="fa fa-sign-in mr-1"></i> 登录系统
            </a>
        </div>
    </header>

    <main class="flex-1 flex items-start justify-center p-4 md:p-8">
        <div class="w-full max-w-2xl">
            <div class="bg-white rounded-lg shadow overflow-hidden">
                <div class="bg-gradient-blue p-6 text-center">
                    <h1 class="text-2xl font-bold text-white text-shadow">申请提交</h1>
                    <p class="text-blue-100 mt-1">通用申请单 · 提交后请保存申请编号</p>
                </div>

                <div class="p-6 md:p-8">
                    <div id="errorBox" class="hidden mb-4 px-4 py-3 rounded-md bg-red-50 border border-red-200 text-sm text-red-700"></div>

                    <form id="requestForm" class="space-y-5" novalidate>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                            <div>
                                <label for="applicantName" class="block text-sm font-medium text-gray-700 mb-1">申请人 <span class="text-red-500">*</span></label>
                                <input type="text" id="applicantName" name="applicant_name" maxlength="100"
                                       class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all-300"
                                       placeholder="您的姓名" required>
                            </div>
                            <div>
                                <label for="department" class="block text-sm font-medium text-gray-700 mb-1">部门</label>
                                <input type="text" id="department" name="department" maxlength="100"
                                       class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all-300"
                                       placeholder="选填，如：装配部">
                            </div>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                            <div>
                                <label for="contact" class="block text-sm font-medium text-gray-700 mb-1">邮箱 <span class="text-red-500">*</span></label>
                                <input type="email" id="contact" name="contact" maxlength="200"
                                       class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all-300"
                                       placeholder="您的邮箱" required>
                            </div>
                        </div>

                        <div id="goodsSection">
                            <label class="block text-sm font-medium text-gray-700 mb-1">相关货物 <span class="text-xs text-gray-400">选填，可添加多行</span></label>
                            <div class="border border-gray-200 rounded-md overflow-hidden">
                                <table class="w-full text-sm">
                                    <thead class="bg-gray-50">
                                        <tr>
                                            <th class="px-3 py-2 text-left text-xs font-medium text-gray-500">货物</th>
                                            <th class="px-3 py-2 text-left text-xs font-medium text-gray-500 w-28">数量 <span class="text-red-500">*</span></th>
                                            <th class="px-2 py-2 w-10"></th>
                                        </tr>
                                    </thead>
                                    <tbody id="goodsTableBody" class="divide-y divide-gray-100"></tbody>
                                </table>
                                <p id="goodsEmptyHint" class="px-3 py-3 text-xs text-gray-400 text-center">尚未添加货物，可在下方搜索后点击加入</p>
                            </div>
                            <div class="flex gap-2 mt-2">
                                <input type="text" id="goodsSearchInput" maxlength="100"
                                       class="flex-1 px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all-300"
                                       placeholder="输入货物条码或名称搜索">
                                <button type="button" id="goodsSearchBtn"
                                        class="px-4 py-2 border border-gray-300 rounded-md text-gray-700 hover:bg-gray-50 transition-all-300">
                                    <i class="fa fa-search mr-1"></i>搜索
                                </button>
                            </div>
                            <div id="goodsSearchStatus" class="hidden text-xs text-gray-400 mt-1"></div>
                            <ul id="goodsSearchResults" class="hidden mt-1 border border-gray-200 rounded-md divide-y divide-gray-100 bg-white max-h-56 overflow-y-auto"></ul>
                        </div>

                        <div>
                            <label for="description" class="block text-sm font-medium text-gray-700 mb-1">事由描述 <span class="text-red-500">*</span></label>
                            <textarea id="description" name="description" rows="5" maxlength="2000"
                                      class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all-300"
                                      placeholder="请描述申请的事由、数量、期望时间等" required></textarea>
                            <p class="text-xs text-gray-400 mt-1">最多 2000 字</p>
                        </div>

                        <div>
                            <label for="attachmentNote" class="block text-sm font-medium text-gray-700 mb-1">备注</label>
                            <input type="text" id="attachmentNote" name="attachment_note" maxlength="500"
                                   class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all-300"
                                   placeholder="选填。如需提供附件，请写明文件名与获取方式（如：共享盘 CUWX/申请 目录）">
                        </div>

                        <div class="pt-2">
                            <button type="submit" id="submitBtn"
                                    class="w-full bg-primary text-white px-4 py-2.5 rounded-md hover:bg-secondary focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 transition-all-300">
                                <i class="fa fa-paper-plane mr-2"></i>
                                <span>提交申请</span>
                            </button>
                            <p class="text-xs text-gray-400 mt-3 text-center">仅限内网使用 · 提交频率受限制 · 无需登录</p>
                        </div>
                    </form>

                    <div id="successPanel" class="hidden text-center py-6">
                        <div class="w-16 h-16 mx-auto rounded-full bg-green-100 flex items-center justify-center mb-4">
                            <i class="fa fa-check text-3xl text-green-600"></i>
                        </div>
                        <h2 class="text-xl font-semibold text-gray-800">申请已提交</h2>
                        <p class="text-gray-600 mt-2">申请编号</p>
                        <p id="refValue" class="text-lg font-mono font-semibold text-primary mt-1 select-all"></p>
                        <p class="text-sm text-gray-400 mt-3">请保存该编号，处理进展请联系受理管理员跟进（当前系统暂不提供免登录查询）</p>
                        <button id="resetBtn" class="mt-6 px-4 py-2 rounded-md border border-gray-300 text-gray-700 hover:bg-gray-50 transition-all-300">
                            <i class="fa fa-plus mr-1"></i> 再提交一份
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="text-center text-xs text-gray-400 py-4">
        备件管理系统 · 申请提交
    </footer>

    <script>
        // 申请单提交（免登录，内网使用）
        (function () {
            'use strict';
            const form = document.getElementById('requestForm');
            const successPanel = document.getElementById('successPanel');
            const errorBox = document.getElementById('errorBox');
            const submitBtn = document.getElementById('submitBtn');
            const label = submitBtn.querySelector('span');

            function hideError() {
                errorBox.textContent = '';
                errorBox.classList.add('hidden');
            }

            function showError(message) {
                errorBox.textContent = message;
                errorBox.classList.remove('hidden');
                errorBox.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }

            // ---------- 相关货物（选填，多行，与系统内货物联动） ----------
            const goodsItems = [];   // 每行：{barcode, name, spec, unit, qty}
            const goodsTableBody = document.getElementById('goodsTableBody');
            const goodsEmptyHint = document.getElementById('goodsEmptyHint');
            const goodsSearchInput = document.getElementById('goodsSearchInput');
            const goodsSearchBtn = document.getElementById('goodsSearchBtn');
            const goodsResults = document.getElementById('goodsSearchResults');
            const goodsStatus = document.getElementById('goodsSearchStatus');

            function showGoodsStatus(message, isError) {
                goodsStatus.textContent = message;
                goodsStatus.classList.toggle('text-red-500', !!isError);
                goodsStatus.classList.remove('hidden');
            }

            function renderGoodsTable() {
                goodsEmptyHint.classList.toggle('hidden', goodsItems.length > 0);
                goodsTableBody.innerHTML = '';
                goodsItems.forEach(function (g, i) {
                    const tr = document.createElement('tr');
                    const tdName = document.createElement('td');
                    tdName.className = 'px-3 py-2';
                    const nameP = document.createElement('p');
                    nameP.className = 'text-sm text-gray-800 font-medium';
                    nameP.textContent = g.name;
                    const metaP = document.createElement('p');
                    metaP.className = 'text-xs text-gray-400';
                    metaP.textContent = g.barcode + (g.spec ? ' · ' + g.spec : '') + (g.unit ? ' · ' + g.unit : '');
                    tdName.appendChild(nameP);
                    tdName.appendChild(metaP);
                    const tdQty = document.createElement('td');
                    tdQty.className = 'px-3 py-2';
                    const qtyInput = document.createElement('input');
                    qtyInput.type = 'number';
                    qtyInput.min = '0.01';
                    qtyInput.step = 'any';
                    qtyInput.placeholder = '0';
                    qtyInput.className = 'w-full px-2 py-1.5 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent';
                    qtyInput.value = g.qty;
                    qtyInput.addEventListener('input', function () { g.qty = qtyInput.value; });
                    tdQty.appendChild(qtyInput);
                    const tdDel = document.createElement('td');
                    tdDel.className = 'px-2 py-2 text-center';
                    const delBtn = document.createElement('button');
                    delBtn.type = 'button';
                    delBtn.className = 'text-gray-400 hover:text-red-500';
                    delBtn.title = '移除该行';
                    const icon = document.createElement('i');
                    icon.className = 'fa fa-trash';
                    delBtn.appendChild(icon);
                    delBtn.addEventListener('click', function () {
                        goodsItems.splice(i, 1);
                        renderGoodsTable();
                    });
                    tdDel.appendChild(delBtn);
                    tr.appendChild(tdName);
                    tr.appendChild(tdQty);
                    tr.appendChild(tdDel);
                    goodsTableBody.appendChild(tr);
                });
            }

            function addGoods(g) {
                const exists = goodsItems.some(function (x) { return x.barcode === g.barcode; });
                if (exists) {
                    showGoodsStatus('该货物已在列表中，请在上方表格填写数量', true);
                    return false;
                }
                goodsItems.push({ barcode: g.barcode, name: g.name, spec: g.spec, unit: g.unit, qty: '' });
                renderGoodsTable();
                goodsResults.classList.add('hidden');
                goodsResults.innerHTML = '';
                goodsStatus.classList.add('hidden');
                goodsSearchInput.value = '';
                const inputs = goodsTableBody.querySelectorAll('input');
                if (inputs.length) { inputs[inputs.length - 1].focus(); }
                return true;
            }

            async function searchGoods() {
                const keyword = goodsSearchInput.value.trim();
                if (!keyword) {
                    showGoodsStatus('请先输入货物条码或名称', true);
                    return;
                }
                showGoodsStatus('正在搜索...', false);
                goodsResults.classList.add('hidden');
                goodsResults.innerHTML = '';
                try {
                    const resp = await fetch('api/public/goods-search?q=' + encodeURIComponent(keyword));
                    const data = await resp.json().catch(function () { return []; });
                    if (!resp.ok) {
                        throw new Error((data && data.detail) || ('搜索失败（HTTP ' + resp.status + '）'));
                    }
                    if (!Array.isArray(data) || data.length === 0) {
                        goodsStatus.classList.remove('text-red-500');
                        showGoodsStatus('未找到匹配的货物', false);
                        return;
                    }
                    data.forEach(function (g) {
                        const li = document.createElement('li');
                        const btn = document.createElement('button');
                        btn.type = 'button';
                        btn.className = 'w-full text-left px-3 py-2 hover:bg-gray-50 transition-all-300';
                        const nameSpan = document.createElement('span');
                        nameSpan.className = 'block text-sm text-gray-800 font-medium';
                        nameSpan.textContent = g.name;
                        btn.appendChild(nameSpan);
                        const metaSpan = document.createElement('span');
                        metaSpan.className = 'block text-xs text-gray-500';
                        metaSpan.textContent = g.barcode + (g.spec ? ' · ' + g.spec : '') + (g.unit ? ' · ' + g.unit : '');
                        btn.appendChild(metaSpan);
                        btn.addEventListener('click', function () {
                            addGoods(g);
                        });
                        li.appendChild(btn);
                        goodsResults.appendChild(li);
                    });
                    goodsStatus.classList.add('hidden');
                    goodsResults.classList.remove('hidden');
                } catch (error) {
                    showGoodsStatus(error.message || '网络错误，请稍后重试', true);
                }
            }

            goodsSearchBtn.addEventListener('click', searchGoods);
            goodsSearchInput.addEventListener('keydown', function (e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    searchGoods();
                }
            });

            form.addEventListener('submit', async function (event) {
                event.preventDefault();
                hideError();

                const payload = {
                    applicant_name: document.getElementById('applicantName').value.trim(),
                    department: document.getElementById('department').value.trim(),
                    contact: document.getElementById('contact').value.trim(),
                    description: document.getElementById('description').value.trim(),
                    attachment_note: document.getElementById('attachmentNote').value.trim()
                };

                if (!payload.applicant_name || !payload.contact || !payload.description) {
                    showError('请填写带 * 的必填项');
                    return;
                }
                if (payload.contact.length < 3) {
                    showError('邮箱至少 3 个字符');
                    return;
                }

                // 相关货物（选填，可多行）：已添加的行必须填数量
                // 安全约定：只提交 条码+数量；名称/规格/单位由后端按条码查库填充，不传客户端快照
                const items = [];
                for (let i = 0; i < goodsItems.length; i++) {
                    const g = goodsItems[i];
                    const qty = parseFloat(g.qty);
                    if (!isFinite(qty) || qty <= 0) {
                        showError('请填写第 ' + (i + 1) + ' 行货物（' + g.name + '）的数量（大于 0）');
                        return;
                    }
                    items.push({ barcode: g.barcode, quantity: qty });
                }
                payload.items = items;

                submitBtn.disabled = true;
                label.textContent = '提交中...';
                try {
                    const resp = await fetch('api/requests/', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    const data = await resp.json().catch(function () { return {}; });
                    if (!resp.ok) {
                        throw new Error((data && data.detail) || ('提交失败（HTTP ' + resp.status + '）'));
                    }
                    document.getElementById('refValue').textContent = data.reference || ('#' + data.id);
                    form.classList.add('hidden');
                    successPanel.classList.remove('hidden');
                    successPanel.scrollIntoView({ behavior: 'smooth', block: 'center' });
                } catch (error) {
                    showError(error.message || '网络错误，请稍后重试');
                } finally {
                    submitBtn.disabled = false;
                    label.textContent = '提交申请';
                }
            });

            document.getElementById('resetBtn').addEventListener('click', function () {
                form.reset();
                goodsItems.length = 0;
                renderGoodsTable();
                goodsResults.classList.add('hidden');
                goodsResults.innerHTML = '';
                goodsStatus.classList.add('hidden');
                successPanel.classList.add('hidden');
                form.classList.remove('hidden');
            });
        })();
    </script>
</body>
</html>
