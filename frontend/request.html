<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-yNRAmzYVwpoq/9LFw/cZV+YSxmN7NVTPTw5R/Gt70zg='; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
    <title>申请提交 - 备件管理系统</title>
    <link href="assets/css/tailwind.css" rel="stylesheet">
    <link href="assets/css/font-awesome.min.css" rel="stylesheet">
    <link href="assets/css/polish.css" rel="stylesheet">
</head>
<body class="bg-gray-100 min-h-screen flex flex-col polish">
    <header class="bg-white shadow-sm z-10">
        <div class="flex items-center justify-between px-4 py-3">
            <div class="flex items-center">
                <img src="assets/images/logo.png" alt="Logo" class="h-8 w-8">
                <span class="ml-2 text-lg font-semibold text-gray-800">备件管理系统</span>
            </div>
            <a href="index.html" class="text-sm text-gray-600 hover:text-primary">
                <i class="fa fa-sign-in mr-1"></i> 登录系统
            </a>
        </div>
    </header>

    <main class="flex-1 flex items-start justify-center p-4 md:p-8">
        <div class="w-full max-w-2xl">
            <div class="bg-white rounded-lg shadow overflow-hidden">
                <div class="bg-gradient-blue p-6 text-center">
                    <h1 class="text-2xl font-bold text-white text-shadow">申请提交</h1>
                    <p class="text-blue-100 mt-1">通用申请单 · 提交后请保存申请编号</p>
                </div>

                <div class="p-6 md:p-8">
                    <div id="errorBox" class="hidden mb-4 px-4 py-3 rounded-md bg-red-50 border border-red-200 text-sm text-red-700"></div>

                    <form id="requestForm" class="space-y-5" novalidate>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                            <div>
                                <label for="applicantName" class="block text-sm font-medium text-gray-700 mb-1">申请人 <span class="text-red-500">*</span></label>
                                <input type="text" id="applicantName" name="applicant_name" maxlength="100"
                                       class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all-300"
                                       placeholder="您的姓名" required>
                            </div>
                            <div>
                                <label for="department" class="block text-sm font-medium text-gray-700 mb-1">部门</label>
                                <input type="text" id="department" name="department" maxlength="100"
                                       class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all-300"
                                       placeholder="选填，如：装配部">
                            </div>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                            <div>
                                <label for="contact" class="block text-sm font-medium text-gray-700 mb-1">邮箱 <span class="text-red-500">*</span></label>
                                <input type="email" id="contact" name="contact" maxlength="200"
                                       class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all-300"
                                       placeholder="您的邮箱" required>
                            </div>
                            <div>
                                <label for="warehouseId" class="block text-sm font-medium text-gray-700 mb-1">申请仓库 <span class="text-red-500">*</span></label>
                                <select id="warehouseId" name="warehouse_id"
                                        class="w-full px-4 py-2 border border-gray-300 rounded-md bg-white focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all-300">
                                    <option value="">仓库列表加载中…</option>
                                </select>
                                <p class="text-xs text-gray-400 mt-1">备件可用库存按该仓库显示；申请通过后，将从该仓库扣减所选货物的库存</p>
                            </div>
                        </div>

                        <div id="goodsSection">
                            <label class="block text-sm font-medium text-gray-700 mb-1">相关货物 <span class="text-xs text-gray-400">选填 · 可添加多行 · 选择备件后显示可用库存</span></label>
                            <div class="border border-gray-200 rounded-md overflow-hidden">
                                <table class="w-full text-sm">
                                    <thead class="bg-gray-50">
                                        <tr>
                                            <th class="px-3 py-2 text-left text-xs font-medium text-gray-500 w-10">#</th>
                                            <th class="px-3 py-2 text-left text-xs font-medium text-gray-500">备件</th>
                                            <th class="px-3 py-2 text-left text-xs font-medium text-gray-500 w-24">可用库存</th>
                                            <th class="px-3 py-2 text-left text-xs font-medium text-gray-500 w-24">数量 <span class="text-red-500">*</span></th>
                                            <th class="px-2 py-2 w-20"></th>
                                        </tr>
                                    </thead>
                                    <tbody id="goodsTableBody" class="divide-y divide-gray-100"></tbody>
                                </table>
                                <p id="goodsEmptyHint" class="px-3 py-3 text-xs text-gray-400 text-center">尚未添加货物：点击下方"添加货物行"，在该行内搜索并选择备件</p>
                                <div class="px-3 py-2 border-t border-gray-100 flex items-center justify-between bg-gray-50">
                                    <button type="button" id="addGoodsRowBtn"
                                            class="px-3 py-1.5 text-sm font-medium text-primary rounded-md hover:bg-blue-50 transition-all-300">
                                        <i class="fa fa-plus mr-1"></i>添加货物行
                                    </button>
                                    <span id="goodsRowCount" class="text-xs text-gray-400"></span>
                                </div>
                            </div>
                            <div id="goodsSearchStatus" class="hidden text-xs text-gray-400 mt-2"></div>
                            <ul id="goodsSearchResults" class="hidden mt-1 border border-gray-200 rounded-md divide-y divide-gray-100 bg-white max-h-56 overflow-y-auto"></ul>
                        </div>

                        <div>
                            <label for="description" class="block text-sm font-medium text-gray-700 mb-1">事由描述 <span class="text-red-500">*</span></label>
                            <textarea id="description" name="description" rows="5" maxlength="2000"
                                      class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all-300"
                                      placeholder="请描述申请的事由、数量、期望时间等" required></textarea>
                            <p class="text-xs text-gray-400 mt-1">最多 2000 字</p>
                        </div>

                        <div>
                            <label for="attachmentNote" class="block text-sm font-medium text-gray-700 mb-1">备注</label>
                            <input type="text" id="attachmentNote" name="attachment_note" maxlength="500"
                                   class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all-300"
                                   placeholder="选填。如需提供附件，请写明文件名与获取方式（如：共享盘 CUWX/申请 目录）">
                        </div>

                        <div class="pt-2">
                            <button type="submit" id="submitBtn"
                                    class="w-full bg-primary text-white px-4 py-2.5 rounded-md hover:bg-secondary focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 transition-all-300">
                                <i class="fa fa-paper-plane mr-2"></i>
                                <span>提交申请</span>
                            </button>
                            <p class="text-xs text-gray-400 mt-3 text-center">仅限内网使用 · 提交频率受限制 · 无需登录</p>
                        </div>
                    </form>

                    <div id="successPanel" class="hidden text-center py-6">
                        <div class="w-16 h-16 mx-auto rounded-full bg-green-100 flex items-center justify-center mb-4">
                            <i class="fa fa-check text-3xl text-green-600"></i>
                        </div>
                        <h2 class="text-xl font-semibold text-gray-800">申请已提交</h2>
                        <p class="text-gray-600 mt-2">申请编号</p>
                        <p id="refValue" class="text-lg font-mono font-semibold text-primary mt-1 select-all"></p>
                        <p class="text-sm text-gray-400 mt-3">请保存该编号，处理进展请联系受理管理员跟进（当前系统暂不提供免登录查询）</p>
                        <button id="resetBtn" class="mt-6 px-4 py-2 rounded-md border border-gray-300 text-gray-700 hover:bg-gray-50 transition-all-300">
                            <i class="fa fa-plus mr-1"></i> 再提交一份
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="text-center text-xs text-gray-400 py-4">
        备件管理系统 · 申请提交
    </footer>

    <script>
        // 申请单提交（免登录，内网使用）
        (function () {
            'use strict';
            const form = document.getElementById('requestForm');
            const successPanel = document.getElementById('successPanel');
            const errorBox = document.getElementById('errorBox');
            const submitBtn = document.getElementById('submitBtn');
            const label = submitBtn.querySelector('span');

            function hideError() {
                errorBox.textContent = '';
                errorBox.classList.add('hidden');
            }

            function showError(message) {
                errorBox.textContent = message;
                errorBox.classList.remove('hidden');
                errorBox.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }

            // ---------- 申请仓库（必选：审批通过后从该仓库扣减库存） ----------
            const warehouseSelect = document.getElementById('warehouseId');
            let warehousesReady = false;
            async function loadWarehouses() {
                try {
                    const resp = await fetch('api/public/warehouses');
                    const data = await resp.json().catch(function () { return []; });
                    if (!resp.ok || !Array.isArray(data)) {
                        throw new Error((data && data.detail) || ('HTTP ' + resp.status));
                    }
                    if (!data.length) {
                        warehouseSelect.innerHTML = '<option value="">系统暂无启用仓库，无法提交申请</option>';
                        warehouseSelect.disabled = true;
                        return;
                    }
                    warehouseSelect.innerHTML = '';
                    data.forEach(function (w) {
                        const opt = document.createElement('option');
                        opt.value = String(w.id);
                        opt.textContent = w.name ? (w.name + (w.code ? '（' + w.code + '）' : '')) : (w.code || ('仓库#' + w.id));
                        warehouseSelect.appendChild(opt);
                    });
                    warehouseSelect.value = String(data[0].id);  // 默认选中第一个
                    warehousesReady = true;
                } catch (e) {
                    warehouseSelect.innerHTML = '<option value="">仓库列表加载失败，请刷新页面重试</option>';
                    warehouseSelect.disabled = true;
                    showError('仓库列表加载失败：' + e.message);
                }
            }
            loadWarehouses();

            // ---------- 仓库切换联动（评审 P1：库存展示必须与审批扣减仓库一致） ----------
            // 切换仓库后：1) 在途搜索全部作废（epoch 递增，到达即丢弃）；
            // 2) 清空候选面板（候选里的库存是旧仓库的数据）；
            // 3) 已选备件按新仓库【一次批量调用】重新取可用库存，并重算"超可用库存"软提示。
            let whEpoch = 0; // 仓库变更代：已选备件库存快照的失效标记
            function clearCandidates() {
                panelOwner = null;
                goodsResults.classList.add('hidden');
                goodsResults.innerHTML = '';
                goodsStatus.classList.add('hidden');
            }
            async function refreshPickedStock() {
                const picked = goodsRows.filter(function (r) { return r.picked && r.g; });
                if (!picked.length) return;
                const myEpoch = whEpoch;
                const wh = warehouseSelect.value;
                if (!wh) return;
                // 评审 P2 跟进：批量查询——已选行全部条码一次取回（旧实现 N 行 = N 次 goods-search，
                // 行数 >30 时部分请求会撞 30 次/分钟的搜索限流 429，页面残留旧仓库存误导申请人）
                const codes = picked.map(function (r) { return r.g.barcode; });
                let failed = false, got = null;
                try {
                    const resp = await fetch('api/public/stock-lookup?warehouse_id=' + encodeURIComponent(wh) +
                                             '&barcodes=' + encodeURIComponent(codes.join(',')));
                    got = await resp.json().catch(function () { return null; });
                    if (!resp.ok) failed = true;
                } catch (e) {
                    failed = true;
                }
                if (myEpoch !== whEpoch) return; // 期间又切了仓库，本次结果作废
                if (failed || !Array.isArray(got)) {
                    // 刷新失败：已选行一律标记"库存未知"——不再保留旧仓数字误导申请人
                    picked.forEach(function (r) { r.stockUnknown = true; });
                    renderGoodsTable();
                    showGoodsStatus('库存刷新失败（网络繁忙？）受影响行已标记"库存未知"。请重新选择仓库或刷新页面确认；提交时系统仍会按所选仓库复核库存', true);
                    return;
                }
                const byCode = {};
                got.forEach(function (it) { if (it && typeof it.barcode === 'string') byCode[it.barcode] = Number(it.available_stock) || 0; });
                let missing = false;
                picked.forEach(function (r) {
                    if (Object.prototype.hasOwnProperty.call(byCode, r.g.barcode)) {
                        r.g.available_stock = byCode[r.g.barcode];
                        r.stockUnknown = false;
                    } else {
                        r.stockUnknown = true; // 防御：后端契约应返回全部条码，缺行同样视为未知
                        missing = true;
                    }
                });
                renderGoodsTable(); // 重渲染库存列，并按新库存重算"超出可用库存"软提示
                if (missing) {
                    showGoodsStatus('部分备件库存刷新失败，受影响行已标记"库存未知"。请重新选择仓库或刷新页面确认', true);
                } else {
                    showGoodsStatus('仓库已切换，已选备件库存已按新仓库刷新', false);
                }
            }
            warehouseSelect.addEventListener('change', function () {
                if (!warehousesReady) return;
                whEpoch++;
                searchEpoch++;   // 在途搜索结果作废（到达时 epoch 不匹配即丢弃）
                clearCandidates();
                refreshPickedStock();
            });

            // ---------- 相关货物（选填，多行：添加行 → 行内搜索选择备件 → 显示可用库存） ----------
            // 每行状态：{ rowId: 稳定id, picked: bool, g: {barcode,name,spec,unit,available_stock}|null, qty: '', keyword: '' }
            const goodsRows = [];
            const goodsTableBody = document.getElementById('goodsTableBody');
            const goodsEmptyHint = document.getElementById('goodsEmptyHint');
            const goodsRowCount = document.getElementById('goodsRowCount');
            const addGoodsRowBtn = document.getElementById('addGoodsRowBtn');
            const goodsResults = document.getElementById('goodsSearchResults');
            const goodsStatus = document.getElementById('goodsSearchStatus');
            let rowIdSeq = 0;      // 行稳定 ID（重渲染后不变，用于精确定位某行）
            let searchEpoch = 0;   // 全局搜索序号：只有最新一次搜索的结果可接管候选面板（防交错竞态）
            let panelOwner = null; // { row, epoch } — 当前候选面板归属的行

            function showGoodsStatus(message, isError) {
                goodsStatus.textContent = message;
                goodsStatus.classList.toggle('text-red-500', !!isError);
                goodsStatus.classList.remove('hidden');
            }

            function fmtNum(v) {
                const n = Number(v);
                if (!isFinite(n)) return '0';
                return String(parseFloat(n.toFixed(4)));
            }

            function stockCellHTML(g, unknown) {
                // 评审 P2 跟进：刷新失败时标记"库存未知"（灰显），不保留旧仓数字误导申请人
                if (unknown) {
                    return '<span class="font-medium text-amber-600">库存未知（刷新失败，请重新确认）</span>';
                }
                const n = Number(g.available_stock) || 0;
                const unit = g.unit ? ' ' + g.unit : '';
                if (n > 0) {
                    return '<span class="font-medium text-green-700">' + fmtNum(n) + unit + '</span>';
                }
                return '<span class="font-medium text-red-500">0' + unit + '（无库存）</span>';
            }

            function renderGoodsTable() {
                goodsEmptyHint.classList.toggle('hidden', goodsRows.length > 0);
                const pickedCount = goodsRows.filter(function (r) { return r.picked; }).length;
                goodsRowCount.textContent = goodsRows.length ? (goodsRows.length + ' 行 · 已选 ' + pickedCount + ' 种备件') : '';
                goodsTableBody.innerHTML = '';
                goodsRows.forEach(function (row, i) {
                    const tr = document.createElement('tr');
                    tr.dataset.rowId = row.rowId;

                    const tdIdx = document.createElement('td');
                    tdIdx.className = 'px-3 py-2 text-gray-400';
                    tdIdx.textContent = String(i + 1);
                    tr.appendChild(tdIdx);

                    // 备件列：未选择 → 行内搜索；已选择 → 备件信息
                    const tdPart = document.createElement('td');
                    tdPart.className = 'px-3 py-2';
                    if (row.picked) {
                        const nameP = document.createElement('p');
                        nameP.className = 'text-sm text-gray-800 font-medium';
                        nameP.textContent = row.g.name;
                        const metaP = document.createElement('p');
                        metaP.className = 'text-xs text-gray-400';
                        metaP.textContent = row.g.barcode + (row.g.spec ? ' · ' + row.g.spec : '');
                        tdPart.appendChild(nameP);
                        tdPart.appendChild(metaP);
                    } else {
                        const wrap = document.createElement('div');
                        wrap.className = 'flex gap-2';
                        const input = document.createElement('input');
                        input.type = 'text';
                        input.maxLength = 100;
                        input.placeholder = '输入名称或条码搜索备件';
                        input.className = 'flex-1 min-w-0 px-2 py-1.5 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent';
                        input.value = row.keyword || '';
                        input.addEventListener('input', function () { row.keyword = input.value; });
                        const btn = document.createElement('button');
                        btn.type = 'button';
                        btn.className = 'px-2.5 py-1.5 border border-gray-300 rounded-md text-gray-700 hover:bg-gray-50 transition-all-300';
                        btn.title = '搜索备件';
                        const icon = document.createElement('i');
                        icon.className = 'fa fa-search';
                        btn.appendChild(icon);
                        const doSearch = function () { searchRowGoods(i, input); };
                        btn.addEventListener('click', doSearch);
                        input.addEventListener('keydown', function (e) {
                            if (e.key === 'Enter') { e.preventDefault(); doSearch(); }
                        });
                        wrap.appendChild(input);
                        wrap.appendChild(btn);
                        tdPart.appendChild(wrap);
                    }
                    tr.appendChild(tdPart);

                    // 可用库存列
                    const tdStock = document.createElement('td');
                    tdStock.className = 'px-3 py-2 text-sm';
                    tdStock.innerHTML = row.picked
                        ? stockCellHTML(row.g, !!row.stockUnknown)
                        : '<span class="text-gray-400">—</span>';
                    tr.appendChild(tdStock);

                    // 数量列（已选择备件后可填；超过可用库存给软提示，不阻断提交）
                    const tdQty = document.createElement('td');
                    tdQty.className = 'px-3 py-2';
                    if (row.picked) {
                        const qtyInput = document.createElement('input');
                        qtyInput.type = 'number';
                        qtyInput.min = '0.01';
                        qtyInput.step = 'any';
                        qtyInput.placeholder = '0';
                        qtyInput.className = 'w-full px-2 py-1.5 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent';
                        qtyInput.value = row.qty;
                        const warn = document.createElement('p');
                        warn.className = 'qty-warn hidden text-xs text-amber-600 mt-0.5';
                        warn.textContent = '库存未知';
                        const refreshWarn = function () {
                            if (row.stockUnknown) {
                                // 评审 P2：刷新失败标记未知——不显示"超过可用库存"（无可靠基准），提示用户重新确认
                                warn.textContent = '库存未知（请重新选择仓库或刷新确认）';
                                warn.className = 'qty-warn text-xs text-amber-600 mt-0.5';
                                return;
                            }
                            warn.textContent = '超过可用库存';
                            warn.className = 'qty-warn text-xs text-red-500 mt-0.5';
                            const q = parseFloat(qtyInput.value);
                            const over = isFinite(q) && q > 0 && q > (Number(row.g.available_stock) || 0);
                            warn.classList.toggle('hidden', !over);
                        };
                        qtyInput.addEventListener('input', function () { row.qty = qtyInput.value; refreshWarn(); });
                        tdQty.appendChild(qtyInput);
                        tdQty.appendChild(warn);
                        refreshWarn();
                    } else {
                        tdQty.innerHTML = '<span class="text-gray-400">—</span>';
                    }
                    tr.appendChild(tdQty);

                    // 操作列：已选择 → 更换/移除；未选择 → 移除
                    const tdDel = document.createElement('td');
                    tdDel.className = 'px-2 py-2 text-right whitespace-nowrap';
                    if (row.picked) {
                        const changeBtn = document.createElement('button');
                        changeBtn.type = 'button';
                        changeBtn.className = 'text-xs text-primary hover:underline';
                        changeBtn.textContent = '更换';
                        changeBtn.addEventListener('click', function () {
                            row.picked = false;
                            row.g = null;
                            row.qty = '';
                            if (panelOwner && panelOwner.row === row) {
                                panelOwner = null;
                                goodsResults.classList.add('hidden');
                                goodsResults.innerHTML = '';
                                goodsStatus.classList.add('hidden');
                            }
                            renderGoodsTable();
                            focusRowSearch(row);
                        });
                        tdDel.appendChild(changeBtn);
                        tdDel.appendChild(document.createTextNode(' '));
                    }
                    const delBtn = document.createElement('button');
                    delBtn.type = 'button';
                    delBtn.className = 'text-gray-400 hover:text-red-500 ml-1';
                    delBtn.title = '移除该行';
                    const delIcon = document.createElement('i');
                    delIcon.className = 'fa fa-trash';
                    delBtn.appendChild(delIcon);
                    delBtn.addEventListener('click', function () {
                        goodsRows.splice(goodsRows.indexOf(row), 1);
                        if (panelOwner && panelOwner.row === row) {
                            panelOwner = null;
                            goodsResults.classList.add('hidden');
                            goodsResults.innerHTML = '';
                            goodsStatus.classList.add('hidden');
                        }
                        renderGoodsTable();
                    });
                    tdDel.appendChild(delBtn);
                    tr.appendChild(tdDel);

                    goodsTableBody.appendChild(tr);
                });
            }

            function focusRowSearch(row) {
                const tr = goodsTableBody.querySelector('tr[data-row-id="' + row.rowId + '"]');
                const inp = tr ? tr.querySelector('input[type="text"]') : null;
                if (inp) { inp.focus(); inp.select(); }
            }

            addGoodsRowBtn.addEventListener('click', function () {
                const row = { rowId: ++rowIdSeq, picked: false, g: null, qty: '', keyword: '' };
                goodsRows.push(row);
                renderGoodsTable();
                focusRowSearch(row);
            });

            async function searchRowGoods(i, input) {
                const row = goodsRows[i];
                const keyword = (input ? input.value : '').trim();
                if (input) row.keyword = input.value;
                if (!keyword) {
                    showGoodsStatus('请先输入备件名称或条码', true);
                    return;
                }
                const epoch = ++searchEpoch;
                showGoodsStatus('正在搜索...', false);
                goodsResults.classList.add('hidden');
                goodsResults.innerHTML = '';
                try {
                    // 评审 P1：搜索必须携带当前所选仓库，可用库存按该仓库汇总，
                    // 与审批实际扣减仓库一致（否则多仓时页面显示的是别的仓库的库存）
                    let searchUrl = 'api/public/goods-search?q=' + encodeURIComponent(keyword);
                    const curWh = warehouseSelect.value;
                    if (curWh) searchUrl += '&warehouse_id=' + encodeURIComponent(curWh);
                    const resp = await fetch(searchUrl);
                    const data = await resp.json().catch(function () { return []; });
                    if (!resp.ok) {
                        throw new Error((data && data.detail) || ('搜索失败（HTTP ' + resp.status + '）'));
                    }
                    // 过期结果防护：已有更新的搜索、或本行已被移除/重新选择 → 丢弃本次响应（防交错竞态/错行）
                    if (epoch !== searchEpoch || goodsRows.indexOf(row) === -1 || row.picked) return;
                    panelOwner = { row: row, epoch: epoch };
                    if (!Array.isArray(data) || data.length === 0) {
                        showGoodsStatus('未找到匹配的备件', false);
                        return;
                    }
                    data.forEach(function (g) {
                        const li = document.createElement('li');
                        const btn = document.createElement('button');
                        btn.type = 'button';
                        btn.className = 'w-full text-left px-3 py-2 hover:bg-gray-50 transition-all-300';
                        const nameSpan = document.createElement('span');
                        nameSpan.className = 'block text-sm text-gray-800 font-medium';
                        nameSpan.textContent = g.name;
                        btn.appendChild(nameSpan);
                        const metaSpan = document.createElement('span');
                        metaSpan.className = 'block text-xs text-gray-500';
                        metaSpan.textContent = g.barcode + (g.spec ? ' · ' + g.spec : '') + (g.unit ? ' · ' + g.unit : '');
                        btn.appendChild(metaSpan);
                        const stockSpan = document.createElement('span');
                        stockSpan.className = 'block text-xs mt-0.5';
                        const n = Number(g.available_stock) || 0;
                        if (n > 0) {
                            stockSpan.innerHTML =
                                '<span class="text-green-700 font-medium">可用库存 ' + fmtNum(n) + (g.unit ? ' ' + g.unit : '') + '</span>';
                        } else {
                            stockSpan.innerHTML =
                                '<span class="text-red-500 font-medium">可用库存 0' + (g.unit ? ' ' + g.unit : '') + '（无库存，可先申请）</span>';
                        }
                        btn.appendChild(stockSpan);
                        btn.addEventListener('click', function () { selectRowGoods(row, g); });
                        li.appendChild(btn);
                        goodsResults.appendChild(li);
                    });
                    goodsStatus.classList.add('hidden');
                    goodsResults.classList.remove('hidden');
                } catch (error) {
                    if (epoch === searchEpoch) {
                        showGoodsStatus(error.message || '网络错误，请稍后重试', true);
                    }
                }
            }

            function selectRowGoods(row, g) {
                if (!row || !panelOwner || panelOwner.row !== row) {
                    showGoodsStatus('搜索结果已失效，请重新搜索后再选择', true);
                    return;
                }
                let dupIndex = -1;
                goodsRows.forEach(function (r, idx) {
                    if (r !== row && r.picked && r.g && r.g.barcode === g.barcode) dupIndex = idx;
                });
                if (dupIndex >= 0) {
                    showGoodsStatus('该备件已在第 ' + (dupIndex + 1) + ' 行，请直接修改该行数量', true);
                    return;
                }
                row.picked = true;
                row.g = {
                    barcode: g.barcode, name: g.name, spec: g.spec, unit: g.unit,
                    available_stock: Number(g.available_stock) || 0
                };
                row.stockUnknown = false; // 新选行：库存来自当前仓库的最新搜索，清除"未知"标记
                row.qty = '';
                row.keyword = '';
                panelOwner = null;
                renderGoodsTable();
                goodsResults.classList.add('hidden');
                goodsResults.innerHTML = '';
                goodsStatus.classList.add('hidden');
                const qtyTr = goodsTableBody.querySelector('tr[data-row-id="' + row.rowId + '"]');
                const qtyInput = qtyTr ? qtyTr.querySelector('input[type="number"]') : null;
                if (qtyInput) qtyInput.focus();
            }

            form.addEventListener('submit', async function (event) {
                event.preventDefault();
                hideError();

                const payload = {
                    applicant_name: document.getElementById('applicantName').value.trim(),
                    department: document.getElementById('department').value.trim(),
                    contact: document.getElementById('contact').value.trim(),
                    description: document.getElementById('description').value.trim(),
                    attachment_note: document.getElementById('attachmentNote').value.trim()
                };

                if (!payload.applicant_name || !payload.contact || !payload.description) {
                    showError('请填写带 * 的必填项');
                    return;
                }
                if (!warehousesReady) {
                    showError('仓库列表尚未加载完成，请刷新页面重试');
                    return;
                }
                const warehouseId = parseInt(warehouseSelect.value, 10);
                if (!isFinite(warehouseId) || warehouseId <= 0) {
                    showError('请选择申请仓库');
                    return;
                }
                payload.warehouse_id = warehouseId;
                if (payload.contact.length < 3) {
                    showError('邮箱至少 3 个字符');
                    return;
                }

                // 相关货物（选填，可多行）：未选择备件的行不含数据、不参与提交；
                // 已选择备件的行必须填写数量（大于 0）
                // 安全约定：只提交 条码+数量；名称/规格/单位由后端按条码查库填充，不传客户端快照
                const items = [];
                for (let i = 0; i < goodsRows.length; i++) {
                    const row = goodsRows[i];
                    if (!row.picked || !row.g) continue;
                    const qty = parseFloat(row.qty);
                    if (!isFinite(qty) || qty <= 0) {
                        showError('请填写第 ' + (i + 1) + ' 行备件（' + row.g.name + '）的数量（大于 0）');
                        return;
                    }
                    items.push({ barcode: row.g.barcode, quantity: qty });
                }
                payload.items = items;

                submitBtn.disabled = true;
                label.textContent = '提交中...';
                try {
                    const resp = await fetch('api/requests/', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    const data = await resp.json().catch(function () { return {}; });
                    if (!resp.ok) {
                        throw new Error((data && data.detail) || ('提交失败（HTTP ' + resp.status + '）'));
                    }
                    document.getElementById('refValue').textContent = data.reference || ('#' + data.id);
                    form.classList.add('hidden');
                    successPanel.classList.remove('hidden');
                    successPanel.scrollIntoView({ behavior: 'smooth', block: 'center' });
                } catch (error) {
                    showError(error.message || '网络错误，请稍后重试');
                } finally {
                    submitBtn.disabled = false;
                    label.textContent = '提交申请';
                }
            });

            document.getElementById('resetBtn').addEventListener('click', function () {
                form.reset();
                goodsRows.length = 0;
                panelOwner = null;
                renderGoodsTable();
                goodsResults.classList.add('hidden');
                goodsResults.innerHTML = '';
                goodsStatus.classList.add('hidden');
                successPanel.classList.add('hidden');
                form.classList.remove('hidden');
            });
        })();
    </script>
</body>
</html>
